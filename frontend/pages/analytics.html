<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analytics — FitnessAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span>Fitness<strong>AI</strong></span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="analytics.html" class="nav-item active"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
      <a href="diet.html" class="nav-item"><span class="nav-icon">🥗</span><span class="nav-label">Diet Tracker</span></a>
      <a href="workouts.html" class="nav-item"><span class="nav-icon">💪</span><span class="nav-label">Workouts</span></a>
      <a href="coach.html" class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Coach</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">A</div>
        <div class="user-info"><div class="user-name" id="sidebarName">Loading...</div><div class="user-sub" id="sidebarGoal">—</div></div>
        <button class="btn-icon" onclick="logout()" style="margin-left:auto;font-size:0.9rem">🚪</button>
      </div>
    </div>
  </aside>
  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left"><h1 class="page-title">Analytics</h1><p class="page-sub">Your progress over time</p></div>
      <div class="topbar-right">
        <select id="rangePicker" style="background:var(--bg-card2);border:1px solid var(--border-light);border-radius:8px;padding:8px 14px;color:var(--text-primary);font-family:var(--font-body);outline:none;cursor:pointer" onchange="loadAnalytics()">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 3 months</option>
        </select>
        <button class="topbar-avatar" id="topbarAvatar">A</button>
      </div>
    </header>
    <div class="page-content">
      <div class="analytics-grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr))">
        <div class="card"><div class="card-top"><h3>🔥 Calories Burned</h3><span class="badge badge-purple" id="totalCalsBurned">—</span></div><canvas id="calsBurnedChart" height="220"></canvas></div>
        <div class="card"><div class="card-top"><h3>🍽️ Calorie Intake</h3><span class="badge badge-pink" id="avgCalIntake">—</span></div><canvas id="calIntakeChart" height="220"></canvas></div>
        <div class="card"><div class="card-top"><h3>💪 Workout Frequency</h3><span class="badge badge-teal" id="totalWorkoutsLabel">—</span></div><canvas id="workoutFreqChart" height="220"></canvas></div>
        <div class="card"><div class="card-top"><h3>🥗 Macro Breakdown</h3><span class="badge badge-orange">Average</span></div><canvas id="macroAvgChart" height="220"></canvas></div><div class="card"><div class="card-top"><h3>🚶 Steps Trend</h3><span class="badge badge-orange" id="totalStepsLabel">—</span></div><canvas id="stepsChart" height="220"></canvas></div>
      </div>
    </div>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/analytics.js"></script>
</body>
</html>
