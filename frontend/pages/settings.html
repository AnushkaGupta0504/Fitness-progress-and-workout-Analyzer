<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings — FitnessAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span>Fitness<strong>AI</strong></span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
      <a href="activity.html" class="nav-item"><span class="nav-icon">❤️</span><span class="nav-label">Activity</span></a>
      <a href="diet.html" class="nav-item"><span class="nav-icon">🥗</span><span class="nav-label">Diet Tracker</span></a>
      <a href="workouts.html" class="nav-item"><span class="nav-icon">💪</span><span class="nav-label">Workouts</span></a>
      <a href="coach.html" class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Coach</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">A</div>
        <div class="user-info"><div class="user-name" id="sidebarName">Loading...</div><div class="user-sub" id="sidebarGoal">—</div></div>
        <button class="btn-icon" onclick="logout()" style="margin-left:auto;font-size:0.9rem">🚪</button>
      </div>
    </div>
  </aside>
  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left"><h1 class="page-title">Settings</h1><p class="page-sub">Manage your profile and preferences</p></div>
      <div class="topbar-right"><button class="topbar-avatar" id="topbarAvatar">A</button></div>
    </header>
    <div class="page-content">
      <div class="settings-grid">
        <div class="card settings-menu">
          <div class="settings-menu-item active" onclick="switchTab('profile', this)"><span>👤</span> Profile</div>
          <div class="settings-menu-item" onclick="switchTab('goals', this)"><span>🎯</span> Goals</div>
          <div class="settings-menu-item" onclick="switchTab('password', this)"><span>🔒</span> Password</div>
        </div>
        <div>
          <!-- Profile Tab -->
          <div class="settings-panel active card" id="tab-profile">
            <h3 style="margin-bottom:20px">Profile Information</h3>
            <div class="form-section">
              <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" id="profName" /></div>
                <div class="form-group"><label>Email</label><input type="email" id="profEmail" disabled style="opacity:0.5" /></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Age</label><input type="number" id="profAge" placeholder="25" /></div>
                <div class="form-group"><label>Gender</label>
                  <select id="profGender"><option value="">Prefer not to say</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Weight (kg)</label><input type="number" id="profWeight" placeholder="70" /></div>
                <div class="form-group"><label>Height (cm)</label><input type="number" id="profHeight" placeholder="175" /></div>
              </div>
              <div class="form-group"><label>Activity Level</label>
                <select id="profActivity">
                  <option value="sedentary">Sedentary (little/no exercise)</option>
                  <option value="light">Lightly active (1-3 days/week)</option>
                  <option value="moderate">Moderately active (3-5 days/week)</option>
                  <option value="active">Very active (6-7 days/week)</option>
                  <option value="very_active">Extra active (physical job)</option>
                </select>
              </div>
              <div class="form-error" id="profileError"></div>
              <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
            </div>
          </div>

          <!-- Goals Tab -->
          <div class="settings-panel card" id="tab-goals">
            <h3 style="margin-bottom:20px">Fitness Goals</h3>
            <div class="form-section">
              <div class="form-group"><label>Fitness Goal</label>
                <select id="goalType">
                  <option value="lose_weight">Lose Weight</option>
                  <option value="gain_muscle">Gain Muscle</option>
                  <option value="maintain">Maintain Weight</option>
                  <option value="improve_endurance">Improve Endurance</option>
                </select>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Daily Calorie Goal (kcal)</label><input type="number" id="goalCals" placeholder="2000" /></div>
                <div class="form-group"><label>Daily Step Goal</label><input type="number" id="goalSteps" placeholder="10000" /></div>
              </div>
              <div class="form-group"><label>Goal Weight (kg)</label><input type="number" id="goalWeight" placeholder="65" /></div>
              <div class="form-error" id="goalsError"></div>
              <button class="btn-primary" onclick="saveGoals()">Save Goals</button>
            </div>
          </div>

          <!-- Password Tab -->
          <div class="settings-panel card" id="tab-password">
            <h3 style="margin-bottom:20px">Change Password</h3>
            <div class="form-section">
              <div class="form-group"><label>Current Password</label><input type="password" id="curPass" /></div>
              <div class="form-group"><label>New Password</label><input type="password" id="newPass" /></div>
              <div class="form-group"><label>Confirm New Password</label><input type="password" id="confPass" /></div>
              <div class="form-error" id="passwordError"></div>
              <button class="btn-primary" onclick="changePassword()">Change Password</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/settings.js"></script>
</body>
</html>
