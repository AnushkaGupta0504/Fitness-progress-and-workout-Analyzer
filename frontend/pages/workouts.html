<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workouts — FitnessAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span>Fitness<strong>AI</strong></span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
      <a href="activity.html" class="nav-item"><span class="nav-icon">❤️</span><span class="nav-label">Activity</span></a>
      <a href="diet.html" class="nav-item"><span class="nav-icon">🥗</span><span class="nav-label">Diet Tracker</span></a>
      <a href="workouts.html" class="nav-item active"><span class="nav-icon">💪</span><span class="nav-label">Workouts</span></a>
      <a href="coach.html" class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Coach</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">A</div>
        <div class="user-info"><div class="user-name" id="sidebarName">Loading...</div><div class="user-sub" id="sidebarGoal">—</div></div>
        <button class="btn-icon" onclick="logout()" style="margin-left:auto;font-size:0.9rem">🚪</button>
      </div>
    </div>
  </aside>
  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left"><h1 class="page-title">Workouts</h1><p class="page-sub" id="todayDate"></p></div>
      <div class="topbar-right">
        <button class="btn-primary" onclick="showWorkoutModal()">+ Log Workout</button>
        <button class="topbar-avatar" id="topbarAvatar">A</button>
      </div>
    </header>
    <div class="page-content">
      <!-- Weekly Stats -->
      <div class="workout-stats">
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(124,92,252,0.15);color:var(--primary-light)">🏋️</div>
          <div class="stat-info"><div class="stat-value" id="wkWeeklyCount">—</div><div class="stat-label">Workouts This Week</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(255,107,157,0.15);color:var(--accent-pink)">🔥</div>
          <div class="stat-info"><div class="stat-value" id="wkWeeklyCals">—</div><div class="stat-label">Calories Burned</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(0,212,170,0.15);color:var(--accent-teal)">⏱️</div>
          <div class="stat-info"><div class="stat-value" id="wkWeeklyDuration">—</div><div class="stat-label">Total Minutes</div></div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="card" style="padding:16px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span style="color:var(--text-muted);font-size:0.85rem">Filter:</span>
          <button class="badge badge-purple filter-btn active" data-type="all" onclick="filterWorkouts('all', this)">All</button>
          <button class="badge filter-btn" data-type="cardio" onclick="filterWorkouts('cardio', this)" style="background:rgba(0,212,170,0.1);color:var(--accent-teal);border:1px solid rgba(0,212,170,0.3)">🏃 Cardio</button>
          <button class="badge filter-btn" data-type="strength" onclick="filterWorkouts('strength', this)" style="background:rgba(255,107,157,0.1);color:var(--accent-pink);border:1px solid rgba(255,107,157,0.3)">💪 Strength</button>
          <button class="badge filter-btn" data-type="yoga" onclick="filterWorkouts('yoga', this)" style="background:rgba(255,209,102,0.1);color:var(--accent-yellow);border:1px solid rgba(255,209,102,0.3)">🧘 Yoga</button>
          <button class="badge filter-btn" data-type="hiit" onclick="filterWorkouts('hiit', this)" style="background:rgba(255,140,66,0.1);color:var(--accent-orange);border:1px solid rgba(255,140,66,0.3)">⚡ HIIT</button>
        </div>
      </div>

      <!-- Workouts List -->
      <div class="workouts-list" id="workoutsList"><div class="loading-spinner"></div></div>
    </div>
  </main>

  <!-- ADD WORKOUT MODAL -->
  <div class="modal-overlay" id="workoutModal" onclick="closeWorkoutModal(event)">
    <div class="modal-box modal-lg">
      <button class="modal-close" onclick="document.getElementById('workoutModal').classList.remove('active')">✕</button>
      <h2 style="margin-bottom:20px">Log Workout</h2>
      <div class="form-section">
        <div class="form-row">
          <div class="form-group"><label>Workout Title *</label><input type="text" id="wkTitle" placeholder="Morning Run, Chest Day..." /></div>
          <div class="form-group"><label>Type</label>
            <select id="wkType">
              <option value="cardio">🏃 Cardio</option>
              <option value="strength">💪 Strength</option>
              <option value="yoga">🧘 Yoga</option>
              <option value="hiit">⚡ HIIT</option>
              <option value="sports">⚽ Sports</option>
              <option value="mixed">🔥 Mixed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Duration (minutes)</label><input type="number" id="wkDuration" placeholder="45" /></div>
          <div class="form-group"><label>Calories Burned</label><input type="number" id="wkCals" placeholder="350" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Mood</label>
            <select id="wkMood">
              <option value="great">😄 Great</option>
              <option value="good">🙂 Good</option>
              <option value="okay">😐 Okay</option>
              <option value="tired">😴 Tired</option>
              <option value="bad">😞 Bad</option>
            </select>
          </div>
          <div class="form-group"><label>Date</label><input type="date" id="wkDate" /></div>
        </div>
        <div class="form-group"><label>Notes</label><textarea id="wkNotes" rows="2" placeholder="How did it go?"></textarea></div>
      </div>
      <div class="form-error" id="workoutError"></div>
      <div style="display:flex;gap:12px;margin-top:20px">
        <button class="btn-ghost btn-full" onclick="document.getElementById('workoutModal').classList.remove('active')">Cancel</button>
        <button class="btn-primary btn-full" onclick="saveWorkout()">Save Workout</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/workouts.js"></script>
</body>
</html>
